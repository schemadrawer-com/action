name: 'SchemaDrawer'
description: 'Uploads migration files to schemadrawer.com, waits for the diagram and opens a PR with the result.'
author: 'schemadrawer.com'

inputs:
  sql-directory:
    description: 'Directory (relative to the repo root) holding the migration files. Every file in it, subdirectories included, is uploaded.'
    required: true
  output-path:
    description: 'Path (relative to the repo root) where the SVG diagram should be written.'
    required: true
  api-base-url:
    description: 'Base URL of the SchemaDrawer API.'
    required: false
    default: 'https://app.schemadrawer.com/api/v1'
  migration-type:
    description: 'The migration tool the files are written for (e.g. FLYWAY, LIQUIBASE, PRISMA, DJANGO).'
    required: true
  database-type:
    description: 'Database engine the migration is written for (e.g. POSTGRESQL, MYSQL).'
    required: true
  database-version:
    description: 'Version of the database engine (e.g. 18 for POSTGRESQL, 8.4 for MYSQL).'
    required: true
  user-id:
    description: 'UUID identifying this repository at schemadrawer.com. Defaults to one derived from the repository name.'
    required: false
    default: ''
  timeout-seconds:
    description: 'How long to wait for the diagram before giving up.'
    required: false
    default: '300'
  base-branch:
    description: 'Branch the PR should target. Defaults to the branch the workflow runs on.'
    required: false
    default: ''
  pr-branch:
    description: 'Name of the branch created for the PR. Defaults to schemadrawer/update-<run id>-<run attempt>.'
    required: false
    default: ''
  pr-title:
    description: 'Title of the pull request.'
    required: false
    default: 'Update schema diagram'
  pr-body:
    description: 'Body of the pull request.'
    required: false
    default: 'Automated update of the schema diagram generated by [schemadrawer.com](https://schemadrawer.com).'
  commit-message:
    description: 'Commit message used for the result file.'
    required: false
    default: 'chore: update schema diagram'
  github-token:
    description: 'Token used to push the branch and open the pull request (needs `contents: write` and `pull-requests: write`).'
    required: true

outputs:
  pull-request-url:
    description: 'URL of the pull request that was opened.'
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: 'composite'
  steps:
    - id: draw
      shell: bash
      env:
        SQL_DIRECTORY: ${{ inputs.sql-directory }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        API_BASE_URL: ${{ inputs.api-base-url }}
        MIGRATION_TYPE: ${{ inputs.migration-type }}
        DATABASE_TYPE: ${{ inputs.database-type }}
        DATABASE_VERSION: ${{ inputs.database-version }}
        USER_ID: ${{ inputs.user-id }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: 'bash ${{ github.action_path }}/scripts/draw.sh'

    - id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: 'bash ${{ github.action_path }}/scripts/open-pr.sh'
